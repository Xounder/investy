name: investy-local-bootstrap
services:
  bootstrap:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bootstrap
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: ["node", "docker/init-local.js"]
  e2e-bootstrap:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bootstrap
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: ["node", "docker/init-e2e.js"]
