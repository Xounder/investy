name: investy-local-main
services:
  db:
    image: postgres:16-alpine
    env_file: ../.env.docker.postgres.local
    environment:
      POSTGRES_USER: investy_local
      POSTGRES_DB: investy_local
    volumes:
      - main_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investy_local -d investy_local"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    env_file: ../.env.docker.local
    working_dir: /app/apps/api
    command: ["node", "dist/db/migrate.js"]
    environment:
      BRAPI_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    env_file: ../.env.docker.local
    environment:
      APP_ORIGIN: http://localhost:8080
      PORT: "3000"
      NODE_ENV: development
      BACKUP_DIR: /app/.data/backups
    volumes:
      - main_backup_data:/app/.data/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    init: true
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    env_file: ../.env.docker.local
    environment:
      NODE_ENV: development
      BACKUP_DIR: /app/.data/backups
    volumes:
      - main_backup_data:/app/.data/backups
    command: ["node", "dist/worker/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  main_postgres_data:
  main_backup_data:
