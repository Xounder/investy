pipeline:
  name: "<context>"
  status: pending
  started_at: "<current-date-time>"
  updated_at: "<current-date-time>"
  current_step: null
  current_agent: null
  current_batch: null # Set after task planning; never infer batch completion from code-QA only.
  ready_for_new_session: false
  blocked_by: [] # Add only observed blockers; remove or update when evidence changes.
  # Blocker example (do not seed without fresh evidence):
  # - id: BLOCKER-01
  #   requirement: "Required runtime dependency is available"
  #   evidence: "Observed unavailable at <timestamp>; no secrets or credentials"
  batches: [] # Plan ALL unfinished task IDs exactly once; see session-batches.md.
  # Batch item schema (populate for each BATCH-XX before implementation):
  # - id: BATCH-01
  #   state: pending # pending | running | closing | completed | blocked
  #   close_reason: null
  #   task_ids: [TASK-01]
  #   depends_on: []
  #   context_estimate: {principal_tokens: <scoped-estimate>, assumptions: "Estimate scoped principal intake, reports, QA and retries; reserve closeout separately; not measured telemetry"}
  #   handoff_path: ".opencode/plan/<context>/references/batch-BATCH-01-handoff.md"
  #   principal_session_id: null
  #   closeout: {task_commits: pending, docs_refresh: pending, preliminary_handoff: pending, learning_improvement: pending, continuous_learning: pending, session_save: pending, final_handoff: pending, final_commit: pending, verified: pending}
  steps:
    architecture-initializer:
      status: pending
      notes: null
      updated_at: null
      errors: []
      concerns: []
    solution-designer:
      status: pending
      notes: null
      updated_at: null
      errors: []
      concerns: []
    planning-analyst:
      status: pending
      notes: null
      updated_at: null
      errors: []
      concerns: []
    tech-lead:
      status: pending
      notes: null
      updated_at: null
      errors: []
      concerns: []
    senior-frontend:
      status: pending
      notes: null
      updated_at: null
      errors: []
      concerns: []
      tasks: []
    senior-backend:
      status: pending
      notes: null
      updated_at: null
      errors: []
      concerns: []
      tasks: []
    qa-frontend:
      status: pending
      notes: null
      updated_at: null
      errors: []
      concerns: []
    qa-backend:
      status: pending
      notes: null
      updated_at: null
      errors: []
      concerns: []
  tasks: []
  # Task example (populate only from approved work and actual evidence):
  # - id: TASK-01
  #   title: "<approved task title>"
  #   owner: senior-backend
  #   status: pending
  #   implementation_status: pending
  #   qa_status: pending
  #   validation_status: pending
  #   open_findings: []
  #   feat_commit: null
  #   docs_commit: null
  # Code/config QA approval does not prove runtime acceptance; keep status
  # unfinished and validation_status deferred/blocked until runtime evidence exists.
  history: []
  # history_archive: ".opencode/plan/<context>/references/history-archive.md"
  # Set only when a real, readable archive preserves actual prior history.
  # commit_recovery is migration-only; never seed it in a new pipeline.
  handoff:
    context: null
    architecture_summary: null
    selected_approach: null
    design_summary: null
    planning_summary: null
    task_summary: null
    acceptance_criteria: []
    dependencies: []
    additional_context: []
  resume:
    last_completed_agent: null
    last_completed_step: null
    recovery_required: false
    next_action: null
    recovery_notes: null
