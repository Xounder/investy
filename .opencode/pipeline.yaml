  handoff:
    context: investy-dashboard
    architecture_summary: |
      Product: Investy — multi-user investment portfolio dashboard for the Brazilian retail market.
      Stack: React 18 + Vite + TypeScript SPA; Tailwind CSS v4 theme on DocuForge tokens; Recharts; TanStack Query + Zustand; Node.js + Hono API; zod; PostgreSQL (managed) + Drizzle ORM; email/password auth with httpOnly cookie sessions (OAuth2-ready); scheduled worker process; Vitest + Playwright.
      Core principles: transaction journal as source of truth; user data ownership; multi-user isolation at API layer; provider-agnostic market data proxy with caching + manual override; no secrets in browser; DocuForge design system extended as data-dense dashboard language; multi-device from day one.
      Key decisions (ADR-001..010): full-stack Option C; pnpm monorepo (apps/web, apps/api, packages/domain, worker in apps/api); market-data proxy (brapi.dev + BCB SGS + Yahoo + CoinGecko, TTL cache, manual override); Postgres system of record with integer-cent money; transaction journal + B3 nota import (V1); auth & multi-user isolation; scheduled worker (quotes, snapshots, dividend agenda, backups); hosting/deployment (managed Postgres, no secrets in frontend); design system + Recharts; security foundation.
      Entry files: .opencode/architecture/index.md, architecture.md, architecture-folder-schema.md, commit-pattern.md, docs/adrs/ADR-001..ADR-010.
    selected_approach: "Option C full-stack (ADR-001); IA Option C module-first drawer-amplified; nota full scope with rateio; USD quote + FX; avg-cost display only; full scope remaining items."
    design_summary: |
      Approved design decisions (docs: .opencode/plan/investy-dashboard/design-docs/index.md + design-01..07):
      D1 scope — 9 modules V1 (Auth/Onboarding, Dashboard, Holdings, Transactions/Journal, Nota import, Dividends, Assets Catalog, Reports, Settings); V1/V2/non-goals explicit, reconciled with success criteria + ADR-005.
      D2 IA/UX — Option C module-first + drawer-amplified; global '+ Registrar'; inline holdings row actions; deep-link widgets; tabular numerals; pt-BR only.
      D3 domain/data — journal-first + materialized holdings; integer cents; average-cost realized P&L (display only); USD quote + FX to BRL on read; amortização as capital-return event; rateio de custos (largest-remainder).
      D4 API — resource-oriented REST + aggregates (summary/allocation/snapshots/agenda/benchmarks); nota preview→confirm with importToken; ownership scoping; zod; rate limits.
      D5 design system — DocuForge tokens to dashboard composites (KPI, tables, chips, strips) + Recharts theme; light baseline; skeleton/empty/error states; responsive.
      D6 import/export — lossless journal round-trip (JSON/CSV); nota PDF/text/CSV/XML; verified backups; account erasure; retain all snapshots.
      D7 effort — ~40 dev-days across milestones M0..M9; domain engine first; parallel tracks after M3; matches ADR-001 4-6 wk MVP.
